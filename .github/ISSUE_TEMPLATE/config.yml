# This is an unaffiliated research fork (see NOTICE), so NVIDIA's issue
# routing does not apply here: their bug forms ask for artefacts from their
# support process, and their discussion boards are for their repository.
# Blank issues are enabled because this fork has no triage funnel to send
# people through.
blank_issues_enabled: true
contact_links:
  - name: Report a bug in NVIDIA's driver rather than in this fork
    about: Anything that also reproduces on NVIDIA's own open-gpu-kernel-modules, or on the proprietary driver, belongs with NVIDIA and not here.
    url: https://forums.developer.nvidia.com/c/gpu-graphics/linux/148
